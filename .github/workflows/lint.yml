name: Lint

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

concurrency:
  group: lint-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  DEFAULT_PYTHON: "3.13"

jobs:
  lint-pylint:
    name: 👕 Pylint
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1
      - name: 🏗 Set up Poetry
        run: pipx install poetry
      - name: 🏗 Set up Python ${{ env.DEFAULT_PYTHON }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: "poetry"
      - name: 🏗 Install Python dependencies
        run: poetry install --no-interaction
      - name: 🚀 Run Pylint
        run: poetry run pylint custom_components/goxlr_utility
  lint-jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@996dd60d03b12f28b482074a9eed7083a18e2439 # 20261013.1
  lint-markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@996dd60d03b12f28b482074a9eed7083a18e2439 # 20261013.1
  lint-markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@996dd60d03b12f28b482074a9eed7083a18e2439 # 20261013.1
  lint-yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@996dd60d03b12f28b482074a9eed7083a18e2439 # 20261013.1
  lint-gate:
    name: ✅ Lint gate
    if: always()
    needs:
      - lint-pylint
      - lint-jsonlint
      - lint-markdown-links
      - lint-markdownlint
      - lint-yamllint
    runs-on: ubuntu-latest
    steps:
      - name: ✅ Check lint results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
